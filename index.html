
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork1</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #eef3f7;
        }

        h1 {
            font-style: italic;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        form {
            background-color: #4f97d2;
            width: 500px;
            padding: 35px 45px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(80, 60, 40, 0.18);
        }

        #output1 {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Zephyr List Checker</h1>
    <p>Candidate Verification System</p>

    <form>
        <label for="firstnm">First Name</label>
        <input type="text" id="firstnm" class="form-control" placeholder="ENTER FIRST NAME" required>
        <br>
        <label for="surnm">Surname</label>
        <input type="text" id="surnm" class="form-control" placeholder="ENTER SURNAME" required>
        <br>
        <button type="button" class="btn btn-warning" py-click="checkList">Check</button>

    </form>

    <div id="output1"></div>
    <script type="py" src="main.py"></script>

</body>
</html>
